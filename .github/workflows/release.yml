name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
          MAIN: origin/${{ github.event.repository.default_branch }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN"; then
            echo "::error::tag $TAG points at a commit that is not on ${MAIN#origin/}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml

  assets:
    name: Build archives
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Package Linux and Docker bundles
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: deploy/package.sh "$VERSION" dist

      - name: Upload archives
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    name: Publish image
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/echways/ctx-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ctx-ui
            org.opencontainers.image.description=Gateway and web panel for sharing access to MCP servers

      - name: Build and push amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  builder-assets:
    name: Build builder assets
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Package the extension, installer and compose files
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: deploy/builder/package.sh "$VERSION" builder

      - name: Upload builder assets
        uses: actions/upload-artifact@v7
        with:
          name: builder
          path: builder
          if-no-files-found: error

  builder-images:
    name: Publish ${{ matrix.image }}
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ctx-ui-builder-runner
            context: .
            file: extensions/builder/CtxUi.Builder.Runner/Dockerfile
          - image: ctx-ui-builder-runtime
            context: extensions/builder/runtime
            file: extensions/builder/runtime/Dockerfile
          - image: ctx-ui-builder-egress
            context: extensions/builder/egress
            file: extensions/builder/egress/Dockerfile
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/echways/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and push amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.image == 'ctx-ui-builder-runner' && format('VERSION={0}', needs.version.outputs.version) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  packages:
    name: Pack extension packages
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: ./.github/actions/dotnet

      - name: Pack
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for project in src/CtxUi.Extensions src/CtxUi.Extensions.Testing templates/CtxUi.Extensions.Templates; do
            dotnet pack "$project" -c Release -p:Version="$VERSION" -p:ContinuousIntegrationBuild=true -o artifacts/packages
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          retention-days: 90
          if-no-files-found: error

  nuget:
    name: Publish to NuGet.org
    needs: [version, packages]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: nuget
      url: https://www.nuget.org/packages/CtxUi.Extensions/${{ needs.version.outputs.version }}
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts/packages

      - name: Log in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/packages/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  release:
    name: Publish release
    needs: [version, assets, image, builder-assets, builder-images, nuget]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download builder assets
        uses: actions/download-artifact@v8
        with:
          name: builder
          path: builder

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat builder/SHA256SUMS >> dist/SHA256SUMS
          rm builder/SHA256SUMS
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          cat > notes.md <<EOF
          ## Install

          Binary and systemd, Linux x86_64/aarch64:

          \`\`\`bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sudo bash
          \`\`\`

          Docker: \`ghcr.io/echways/ctx-ui:$VERSION\`, compose bundle \`ctx-ui-$VERSION-docker.tar.gz\`.

          ## Update

          \`\`\`bash
          sudo ctx-ui update $VERSION
          \`\`\`

          Docker: set \`CTX_UI_VERSION=$VERSION\` in \`.env\`, then \`docker compose up -d\`.

          ## Server builder

          Optional extension for an installed ctx-ui, needs Docker Engine 29 or newer:

          \`\`\`bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/builder-install.sh | sudo bash
          \`\`\`

          Images: \`ghcr.io/echways/ctx-ui-builder-runner:$VERSION\`, \`-runtime\` and \`-egress\`.

          EOF
          gh release create "$TAG" dist/* builder/* --repo "$GITHUB_REPOSITORY" --title "ctx-ui $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
