name: Set up .NET
description: Installs the SDK pinned in global.json and restores the NuGet package cache

runs:
  using: composite
  steps:
    - name: Install .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore NuGet cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-${{ github.job }}-
