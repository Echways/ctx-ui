name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
          MAIN: origin/${{ github.event.repository.default_branch }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $TAG is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN"; then
            echo "::error::tag $TAG points at a commit that is not on ${MAIN#origin/}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  assets:
    needs: [version, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: deploy/package.sh "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/echways/ctx-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ctx-ui
            org.opencontainers.image.description=Gateway and web panel for sharing access to MCP servers
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, assets, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          cat > notes.md <<EOF
          ## Install

          Binary and systemd, Linux x86_64/aarch64:

          \`\`\`bash
          curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | sudo bash
          \`\`\`

          Docker: \`ghcr.io/echways/ctx-ui:$VERSION\`, compose bundle \`ctx-ui-$VERSION-docker.tar.gz\`.

          ## Update

          \`\`\`bash
          sudo ctx-ui update $VERSION
          \`\`\`

          Docker: set \`CTX_UI_VERSION=$VERSION\` in \`.env\`, then \`docker compose up -d\`.

          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "ctx-ui $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"
